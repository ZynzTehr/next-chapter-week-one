<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" aria-label="Rest Easy Cleaning Co. logo" role="img">
  <!-- Brand Icon -->
  <g transform="translate(4, 4)">
    <!-- Soft circular background badge -->
    <rect width="56" height="56" rx="16" fill="#E8F1EC" />
    
    <!-- Warm house contour -->
    <path d="M16 36V26L28 17L40 26V36C40 37.6569 38.6569 39 37 39H19C17.3431 39 16 37.6569 16 36Z" stroke="#25543D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/>
    
    <!-- Sprout leaf inside (freshness & care) -->
    <path d="M28 35V27M28 27C28 24 33 23 33 23C33 26 31 29 28 29" stroke="#C85A2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Subtle sparkling star -->
    <path d="M37 15L38 18L41 19L38 20L37 23L36 20L33 19L36 18L37 15Z" fill="#D97736"/>
    
    <!-- Gentle steam / calm breath curve -->
    <path d="M21 21C22 19 25 19 26 21" stroke="#25543D" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(72, 14)">
    <text x="0" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#1C382B" letter-spacing="-0.5px">Rest Easy</text>
    <text x="105" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#C85A2B" letter-spacing="1px">CLEANING CO.</text>
    <text x="0" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#526A5E">Thoughtful care for homes &amp; offices</text>
  </g>
</svg>
